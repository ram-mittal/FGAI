<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: oklch(0.99 0.002 260); /* Deep Blue Light */
        font-family: 'Inter', sans-serif;
        color: oklch(0.17 0.02 260);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* Typography */
      .title {
        font-size: 80px;
        font-weight: 800;
        letter-spacing: -0.04em;
        text-align: center;
        max-width: 1400px;
        line-height: 1.1;
        opacity: 0;
      }
      .badge {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0.1em;
        padding: 12px 24px;
        border-radius: 9999px;
        background: rgba(0,0,0,0.05);
        color: oklch(0.42 0.15 260);
        margin-bottom: 32px;
        opacity: 0;
      }

      /* Instructor */
      .instructor {
        position: absolute;
        top: 60%;
        display: flex;
        align-items: center;
        gap: 24px;
        background: rgba(255,255,255,0.7);
        backdrop-filter: blur(12px);
        border: 2px solid rgba(0,0,0,0.05);
        padding: 16px 32px;
        border-radius: 9999px;
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1);
        opacity: 0;
      }
      .avatar {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 10px 20px -5px rgba(79,70,229,0.5);
      }
      .avatar svg { width: 32px; height: 32px; }
      .instructor-info { text-align: left; }
      .instructor-label { font-size: 16px; font-weight: 500; color: #64748b; margin-bottom: 4px; }
      .instructor-name { font-size: 24px; font-weight: 700; }

      /* Cards Grid */
      .cards-container {
        position: absolute;
        width: 1400px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0; /* Container stays invisible initially */
      }
      .card {
        background: white;
        border: 2px solid rgba(0,0,0,0.05);
        border-radius: 24px;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        box-shadow: 0 20px 40px -10px rgba(0,0,0,0.05);
        opacity: 0;
      }
      .card-icon {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card-icon svg { width: 40px; height: 40px; }
      .card-title { font-size: 32px; font-weight: 700; }
      .card-desc { font-size: 20px; color: #64748b; }

      /* Footer */
      .footer {
        position: absolute;
        bottom: 50%;
        font-size: 32px;
        font-weight: 500;
        text-align: center;
        color: #64748b;
        opacity: 0;
      }
      .footer span { color: oklch(0.17 0.02 260); font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="18" data-width="1920" data-height="1080">
      
      <!-- Scene 1 & 2: Hero -->
      <div class="badge" id="badge">AIM3002P</div>
      <h1 class="title" id="title">Fundamentals of Generative<br/>Artificial Intelligence</h1>
      
      <div class="instructor" id="instructor">
        <div class="avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <div class="instructor-info">
          <div class="instructor-label">Course Instructor</div>
          <div class="instructor-name">Prof. Shraddha Jadhav</div>
        </div>
      </div>

      <!-- Scene 3: Cards -->
      <div class="cards-container" id="cards-container">
        <div class="card card-item">
          <div class="card-icon" style="background:#eff6ff; color:#2563eb;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          </div>
          <div>
            <div class="card-title">Modules</div>
            <div class="card-desc">Course syllabus & topics</div>
          </div>
        </div>
        <div class="card card-item">
          <div class="card-icon" style="background:#f5f3ff; color:#7c3aed;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v7.31"></path><path d="M14 9.3V1.99"></path><path d="M8.5 2h7"></path><path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path><path d="M5.52 16h12.96"></path></svg>
          </div>
          <div>
            <div class="card-title">Labs</div>
            <div class="card-desc">Practical experiments</div>
          </div>
        </div>
        <div class="card card-item">
          <div class="card-icon" style="background:#fff7ed; color:#ea580c;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"></path><path d="m12 15-3-3a22 22 0 0 1 3.86-126.54a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83L15 12"></path></svg>
          </div>
          <div>
            <div class="card-title">Projects</div>
            <div class="card-desc">Course projects & ideas</div>
          </div>
        </div>
      </div>

      <!-- Scene 4: Footer -->
      <div class="footer" id="footer">
        Built with ❤️ for students. <br/><br/> Made by <span>Ram Mittal</span>.
      </div>
      
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      
      // Initial Setup
      gsap.set("#cards-container", { opacity: 1 }); // container visible, children animated

      // Scene 1: The Hook (0s - 4s)
      tl.fromTo("#badge", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.5)" }, 0.5);
      tl.fromTo("#title", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, 1.0);

      // Scene 2: The Instructor (4s - 7s)
      tl.fromTo("#instructor", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "back.out(1.2)" }, 3.5);

      // Clean Out Scene 1 & 2
      tl.to(["#badge", "#title", "#instructor"], { opacity: 0, y: -30, duration: 0.6, ease: "power2.inOut", stagger: 0.1 }, 6.5);

      // Scene 3: Cards Cascade (7.5s - 13s)
      tl.fromTo(".card-item", 
        { opacity: 0, y: 50, scale: 0.95 }, 
        { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.2)", stagger: 0.15 }, 
        7.5
      );

      // Clean Out Scene 3
      tl.to(".card-item", { opacity: 0, scale: 0.9, duration: 0.6, ease: "power2.inOut", stagger: 0.1 }, 12.5);

      // Scene 4: Payoff (13.5s - 18s)
      tl.fromTo("#footer", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 13.5);

      // Final Fade
      tl.to("#footer", { opacity: 0, duration: 0.8, ease: "power1.inOut" }, 17);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
